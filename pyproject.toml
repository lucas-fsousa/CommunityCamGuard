[project]
name = "community-cam-guard"
version = "0.1.0"
description = "Community Cam Guard (CCG) — open-source, self-hosted NVR & dashboard to discover, stream, record and control generic ONVIF/RTSP IP cameras (Yoosee and other Chinese Wi-Fi cams included)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "cryptography>=42",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A focused, high-signal set: pyflakes (F, real bugs), pycodestyle (E/W), import order (I),
# pyupgrade (UP), bugbear (B), and Ruff's own (RUF). Deliberately NOT the opinionated families
# (blind-except, naive-datetime, subprocess-check, assert-in-tests) — this codebase uses those
# patterns on purpose (best-effort resync, ISO-string timestamps), so enforcing them would be noise.
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",   # line length: long explanatory comments are deliberate here; the formatter owns wrapping
    "B008",   # function calls in argument defaults — FastAPI's Depends() idiom relies on it
    "E701",   # compound statements on one line (`def f(): return x`) — a deliberate compact style
    "E702",   # multiple statements per line (`a; b`) — same; adopting Black later would split these
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are the point in tests

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# Start pragmatic: type real mistakes without demanding annotations everywhere yet. Tighten
# (disallow_untyped_defs, etc.) module by module as the codebase gets annotated (see ROADMAP M2).
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["re/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The tests import `backend.app.*`, but the wheel only packages `backend/app`, so an
# editable install doesn't expose the top-level `backend` package. Put the repo root on
# sys.path so bare `pytest` (as CI runs it) resolves it — not just `python -m pytest`.
pythonpath = ["."]
