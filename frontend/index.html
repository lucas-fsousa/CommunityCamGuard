<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Cam Guard</title>
  <link rel="stylesheet" href="/style.css?v=2026-08-05.1" />
</head>
<body>
  <!-- Icon sprite (referenced via <use href="#i-…">) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z"/><circle cx="12" cy="10.5" r="2.4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-single" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M11 9.5l3.5 2.5L11 14.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="i-clips" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7.5" y1="4" x2="7.5" y2="20"/><line x1="16.5" y1="4" x2="16.5" y2="20"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-probe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M12 4.5a7.5 7.5 0 0 1 7.5 7.5"/><path d="M12 1.5a10.5 10.5 0 0 1 10.5 10.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></symbol>
  </defs></svg>

  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <svg class="icon logo-lg"><use href="#i-logo" /></svg>
      <h1>Community Cam Guard</h1>
      <p class="muted" data-i18n="login.prompt">Enter the dashboard key</p>
      <input id="login-key" type="password" data-i18n-ph="login.keyPlaceholder" placeholder="secret key" autocomplete="current-password" />
      <button type="submit" class="btn-primary block" data-i18n="login.unlock">Unlock</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dash" class="hidden">
    <header>
      <div class="brand">
        <svg class="icon logo"><use href="#i-logo" /></svg>
        <div class="brand-text"><strong>Community Cam Guard</strong><span>CCG</span></div>
      </div>
      <div id="storage" class="storage" data-i18n-title="storage.title" title="storage usage"></div>
      <div class="spacer"></div>
      <div class="seg views">
        <button data-view="grid" class="active" data-i18n-title="nav.gridTitle" title="Grid view"><svg class="icon"><use href="#i-grid" /></svg><span data-i18n="nav.grid">Grid</span></button>
        <button data-view="single" data-i18n-title="nav.singleTitle" title="Single camera"><svg class="icon"><use href="#i-single" /></svg><span data-i18n="nav.single">Single</span></button>
        <button data-view="recordings" data-i18n-title="nav.recordingsTitle" title="Browse recordings"><svg class="icon"><use href="#i-clips" /></svg><span data-i18n="nav.recordings">Recordings</span></button>
        <button data-view="cameras" data-i18n-title="nav.camerasTitle" title="Manage cameras"><svg class="icon"><use href="#i-cam" /></svg><span data-i18n="nav.cameras">Cameras</span></button>
      </div>
      <select id="lang" class="lang" data-i18n-title="lang.title" title="Language"></select>
      <button id="btn-logout" class="icon-btn" data-i18n-title="nav.logout" title="Logout"><svg class="icon"><use href="#i-logout" /></svg></button>
    </header>

    <main id="stage" class="grid">
      <div id="rail"></div>
      <div id="players"></div>
      <div id="recordings"></div>
      <div id="cameras"></div>
      <p id="empty" class="muted empty hidden" data-i18n="cams.empty">No cameras yet. Click “Scan network” to find them.</p>
    </main>
  </section>

  <!-- Frontend build badge (fixed corner): app.js fills it from its own ?v= so you can SEE which
       version the browser actually loaded. Bump ALL ?v= below on every .js/.css/.html change. -->
  <div id="app-version" class="app-version" title="Frontend build"></div>

  <script type="module" src="/player.js?v=2026-08-05.1"></script>
  <script src="/i18n.js?v=2026-08-05.1"></script>
  <script src="/app.js?v=2026-08-05.1"></script>
</body>
</html>
