<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordings view: synthetic API, real local playback</title>
<link rel="stylesheet" href="/style.css">
<script>
window.addEventListener('error', () => { window.smokeResult = {ok: false, error: 'Fixture script error'}; });
window.addEventListener('unhandledrejection', () => { window.smokeResult = {ok: false, error: 'Fixture rejection'}; });
</script>
<script type="importmap">{"imports":{"ccg/core":"/core.js","ccg/i18n":"/i18n.js","ccg/recording-playback":"/recording-playback.js"}}</script>
<div id="dash"><main id="stage" class="recordings"><div id="recordings"></div></main></div>
<script type="module">
import { renderRecordings, stopRecordings } from '/recordings.js';
import { state } from '/core.js';
import { setLang, t } from '/i18n.js';
setLang('pt-BR');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const wait = async predicate => {
  const deadline = performance.now() + 8000;
  while (!predicate()) {
    if (performance.now() > deadline) throw new Error('Timed out waiting for view/playback');
    await new Promise(resolve => setTimeout(resolve, 20));
  }
};
const response = body => new Response(JSON.stringify(body), {headers: {'Content-Type': 'application/json'}});
let preparations = 0, delayed, delayedSignal;
const items = ['first.mp4', 'slow.mp4', 'last.mp4'].map(path => ({path, camera_id: 'synthetic',
  camera_name: 'Câmera de exemplo', day: '2026-09-30', started_at: '2026-09-30T12:00:00Z', size_bytes: 78000}));
window.fetch = async (url, options = {}) => {
  if (url.startsWith('/api/recordings?')) return response({total: items.length, retention_days: 7, items});
  if (url.startsWith('/api/recordings/prepare?')) {
    assert(options.method === 'POST', 'Preparation was not explicit POST'); preparations++;
    if (new URL(url, location.href).searchParams.get('path') === 'slow.mp4') {
      delayedSignal = options.signal;
      return new Promise(resolve => { delayed = () => resolve(response({ready: true, cached: true})); });
    }
    return response({ready: true, cached: true});
  }
  throw new Error('Unexpected fixture API request');
};
state.cameras = [{id: 'synthetic', name: 'Câmera de exemplo'}];
try {
  renderRecordings(document.querySelector('#recordings'));
  await wait(() => document.querySelectorAll('.rec-row').length === 3);
  const rows = [...document.querySelectorAll('.rec-row')];
  const video = document.querySelector('video'); video.muted = true;
  const overlay = document.querySelector('.rec-loading-overlay');
  let loads = 0; video.addEventListener('loadstart', () => loads++);
  const start = performance.now(); rows[0].click();
  assert(!overlay.hidden, 'First selection did not show loading');
  await wait(() => video.currentTime > 0.1 && video.videoWidth > 0 && !video.paused);
  const firstFrameMs = Math.round(performance.now() - start);
  assert(overlay.hidden && preparations === 1, 'First click did not settle');
  video.pause(); video.currentTime = 2;
  await wait(() => !video.seeking && video.currentTime >= 2);
  const previousLoads = loads; rows[0].click();
  await wait(() => !video.paused && video.currentTime > 2.1);
  assert(loads === previousLoads && preparations === 1, 'Reselection reloaded or reconverted');
  const download = rows[0].querySelector('.rec-download');
  download.addEventListener('click', event => event.preventDefault()); download.click();
  assert(loads === previousLoads && preparations === 1, 'Download selected recording');
  rows[1].click(); await wait(() => delayed);
  rows[2].click(); assert(delayedSignal.aborted, 'Old preparation not aborted');
  await wait(() => video.currentTime > 0.1 && !video.paused);
  delayed(); await new Promise(resolve => setTimeout(resolve, 100));
  assert(new URL(video.src).searchParams.get('path') === 'last.mp4', 'Late selection replaced current media');
  assert(rows[2].classList.contains('active') && !rows[1].classList.contains('active'), 'Wrong active row');
  assert(overlay.hidden, 'Loading remained after rapid switch');
  assert(document.documentElement.scrollWidth <= innerWidth, 'Horizontal overflow');
  stopRecordings();
  assert(video.paused && !video.hasAttribute('src') && overlay.hidden, 'Navigation retained media/loading');
  // Accelerate only the list deadline; a hanging fetch must abort and allow a retry.
  const nativeTimeout = window.setTimeout;
  let timedOut = false, retries = 0;
  window.setTimeout = (callback, delay, ...args) => nativeTimeout(callback, delay === 15000 ? 50 : delay, ...args);
  window.fetch = (url, options = {}) => {
    assert(url.startsWith('/api/recordings?'), 'Unexpected request during list timeout');
    if (++retries > 1) return Promise.resolve(response({total: 3, retention_days: 7, items}));
    return new Promise((resolve, reject) => options.signal.addEventListener('abort', () => {
      timedOut = true; reject(new DOMException('Aborted', 'AbortError'));
    }, {once: true}));
  };
  renderRecordings(document.querySelector('#recordings'));
  await wait(() => document.querySelector('.rec-list').textContent === t('rec.loadFailed'));
  assert(timedOut && retries === 1, 'Timeout did not abort or retried automatically');
  document.querySelector('.rec-filter button').click();
  await wait(() => document.querySelectorAll('.rec-row').length === 3);
  stopRecordings(); window.setTimeout = nativeTimeout;
  window.smokeResult = {ok: true, viewport: [innerWidth, innerHeight], firstFrameMs,
    preparations, seek: true, reselectionWithoutReload: true, rapidSwitch: true, downloadIsolated: true,
    cleanup: true, listTimeoutAndRetry: true};
} catch (error) { stopRecordings(); window.smokeResult = {ok: false, error: error.message}; }
</script>
</html>
