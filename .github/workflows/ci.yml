name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: >-
          ruff check backend tests scripts/check_delegated_access.py
          scripts/check_recording_browser.py scripts/browser_test_safety.py
          scripts/browser_cdp.py scripts/check_browser_session.py
          scripts/check_browser_media.py
          scripts/check_public_channels.py scripts/channel_media_probe.py
          build_tools/install_go2rtc.py
      - name: Type-check (mypy)
        run: mypy backend/app
      - name: Pinned go2rtc fixture for owned RTSP ingress
        run: python build_tools/install_go2rtc.py --arch amd64 --output bin/go2rtc
      - name: Test (pytest)
        timeout-minutes: 10
        # Print the active test and dump thread stacks for a stalled test. The
        # workflow timeout is the hard stop; faulthandler is diagnostic only.
        run: pytest -o addopts='' -v -o faulthandler_timeout=60
      - name: Frontend contracts (Node)
        run: node --max-old-space-size=64 tests/frontend/camera-controls.cjs
      - name: Recording playback lifecycle (Node)
        run: node --max-old-space-size=64 tests/frontend/recording-playback.cjs
      - name: Recording list lifecycle (Node)
        run: node --max-old-space-size=64 tests/frontend/recordings-view.cjs
      - name: Settings view contracts (Node)
        run: node --max-old-space-size=64 tests/frontend/settings.cjs
      - name: Delegated access contracts (Node)
        run: node --max-old-space-size=64 tests/frontend/access-keys.cjs
      - name: Session lifecycle contracts (Node)
        run: node --max-old-space-size=64 tests/frontend/session-lifecycle.cjs
      - name: Browser media isolation contracts (Node)
        run: node --max-old-space-size=64 tests/frontend/browser-media-probe.cjs
    # Note: `black --check` is intentionally not enforced yet — adopting the formatter across the
    # existing codebase is a deliberate, separate step (see ROADMAP M2). The config lives in
    # pyproject so it is a one-command switch once that lands.
